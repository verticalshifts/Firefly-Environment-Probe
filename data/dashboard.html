<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Environment &amp; Network Probe</title>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" type="image/png" href="img/firefly-favicon-32.png">
</head>
<body>
<header class="app-header">
  <div class="title"><img src="img/firefly-logo.png" alt="Firefly" class="brand-mark"> <span class="dot" id="hdrDot"></span> <span id="hdrName">Environment &amp; Network Probe</span></div>
  <nav class="tabs">
    <a href="dashboard.html">Dashboard</a>
    <a href="environment.html">Environment</a>
    <a href="network.html">Network</a>
    <a href="diagnostics.html">Diagnostics</a>
    <a href="settings.html">Settings</a>
  </nav>
</header>

<main>
  <h1 class="page-title">Dashboard</h1>
  <div class="grid">
    <div class="card" id="gaugeTemp"></div>
    <div class="card" id="gaugeHum"></div>
    <div class="card device-card accent-purple" id="deviceCard">
      <div class="card-head">
        <div class="card-head-icon">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="7" rx="2"></rect>
            <path d="M8 11V8a4 4 0 0 1 8 0v3"></path>
            <circle cx="8" cy="14.5" r="0.6" fill="currentColor" stroke="none"></circle>
            <circle cx="12" cy="14.5" r="0.6" fill="currentColor" stroke="none"></circle>
          </svg>
        </div>
        <div>
          <div class="card-head-title">Device</div>
        </div>
      </div>
      <div class="device-body">
        <div>
          <div class="device-status-row">
            <span class="status-dot" id="deviceStatusDot"></span>
            <span class="device-status-text" id="deviceStatusText">—</span>
          </div>
          <div class="device-status-sub" id="deviceStatusSub">&nbsp;</div>
        </div>
        <div class="wifi-ring" id="wifiRing">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 8.5a16 16 0 0 1 20 0"></path>
            <path d="M5.5 12.5a11 11 0 0 1 13 0"></path>
            <path d="M9 16.5a6 6 0 0 1 6 0"></path>
            <circle cx="12" cy="20" r="1" fill="currentColor" stroke="none"></circle>
          </svg>
        </div>
      </div>
      <div class="info-row info-row-split">
        <span class="info-row-label">
          <span class="info-row-icon">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 20V14"></path>
              <path d="M9.5 20V10"></path>
              <path d="M15 20V6"></path>
              <path d="M20.5 20V3"></path>
            </svg>
          </span>
          Signal Strength
        </span>
        <span class="info-row-value" id="deviceSignalValue">—</span>
      </div>
    </div>
  </div>

  <div class="section-title">Network Health</div>
  <div class="card">
    <div class="table-wrap">
      <table>
        <thead><tr><th>Target</th><th>Status</th><th>Latency</th><th>Loss</th></tr></thead>
        <tbody id="netRows">
          <tr><td colspan="4" class="hint">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="section-title">Environment History</div>
  <div class="card">
    <canvas class="chart" id="miniChart"></canvas>
  </div>
</main>

<script src="js/common.js"></script>
<script src="js/gauge.js"></script>
<script src="js/charts.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
