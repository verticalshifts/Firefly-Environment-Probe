; PlatformIO Project Configuration File
;
; ESP Environment & Network Monitoring Probe — Phase 1
; Supports ESP32 and ESP8266 from one shared codebase.
;
; Build:
;   pio run -e esp32
;   pio run -e esp8266
;
; Upload:
;   pio run -e esp32 -t upload
;   pio run -e esp8266 -t upload
;
; Filesystem (dashboard assets in data/):
;   pio run -e esp32 -t uploadfs
;   pio run -e esp8266 -t uploadfs

[platformio]
default_envs = esp32, esp8266
description = ESP32/ESP8266 Environmental & Network Monitoring Probe (Phase 1)

; ---------------------------------------------------------------------------
; Settings shared by both platforms
; ---------------------------------------------------------------------------
[env]
framework = arduino
monitor_speed = 115200
build_flags =
    -DFIRMWARE_VERSION=\"1.0.0\"
    -DCONFIG_SCHEMA_VERSION=1
lib_deps =
    bblanchon/ArduinoJson @ ^7.1.0
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14

; ---------------------------------------------------------------------------
; ESP32
; ---------------------------------------------------------------------------
[env:esp32]
platform = espressif32
board = esp32dev
board_build.filesystem = littlefs
; The dashboard assets (data/) are only a few KB — trade SPIFFS/LittleFS
; space for more OTA-app headroom (two ~1.9MB app slots instead of ~1.3MB).
board_build.partitions = min_spiffs.csv
build_flags =
    ${env.build_flags}
    -DPLATFORM_ESP32=1
lib_deps =
    ${env.lib_deps}
    marian-craciunescu/ESP32Ping @ ^1.7

; ---------------------------------------------------------------------------
; ESP8266
; ---------------------------------------------------------------------------
[env:esp8266]
platform = espressif8266
board = nodemcuv2
board_build.filesystem = littlefs
build_flags =
    ${env.build_flags}
    -DPLATFORM_ESP8266=1
lib_deps =
    ${env.lib_deps}
    dancol90/ESP8266Ping @ ^1.1.0

; ---------------------------------------------------------------------------
; Native (host) — unit tests only, not part of default_envs. Runs the pure,
; Arduino-independent logic (src/util/RingMath.h) on the host with no board
; attached. Deliberately overrides every [env] default below: nothing here
; should pull in the Arduino framework or ESP-only lib_deps.
;
;   pio test -e native
; ---------------------------------------------------------------------------
[env:native]
platform = native
framework =
build_flags =
lib_deps =
